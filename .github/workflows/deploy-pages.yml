name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Also run unit, browser and screenshot tests (optional)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Run unit tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: npx playwright install --with-deps chromium

      - name: Run functional browser tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: npx playwright test tests/e2e/simulator.spec.ts tests/e2e/studios.spec.ts tests/e2e/utf16.spec.ts tests/e2e/image-journey.spec.ts tests/e2e/hexadecimal.spec.ts

      - name: Audit dependencies
        run: npm run audit

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  visual-regression:
    # Tests are opt-in; ordinary classroom-demo updates deploy without running them.
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run visual regression tests
        run: npm run test:visual

  deploy:
    if: ${{ always() && needs.build.result == 'success' && (needs['visual-regression'].result == 'success' || needs['visual-regression'].result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, visual-regression]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
